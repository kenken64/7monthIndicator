name: Full Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      coverage:
        description: 'Generate coverage report'
        required: false
        default: 'true'
        type: boolean

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Create virtual environment
      run: |
        python -m venv venv
        source venv/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-timeout pytest-flask
        if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

    - name: Run full test suite
      id: test
      continue-on-error: true
      run: |
        chmod +x run_tests.sh
        if [ "${{ github.event.inputs.coverage }}" == "true" ] || [ "${{ github.event_name }}" == "push" ]; then
          ./run_tests.sh --coverage 2>&1 | tee test-output.log
        else
          ./run_tests.sh 2>&1 | tee test-output.log
        fi
        echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

    - name: Generate comprehensive test report
      if: always()
      run: |
        mkdir -p test-results/reports

        # Create main report
        cat > test-results/reports/full-report.md << 'EOF'
        # Full Test Suite Report

        **Repository:** ${{ github.repository }}
        **Branch:** ${{ github.ref_name }}
        **Commit:** ${{ github.sha }}
        **Run:** #${{ github.run_number }}
        **Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        **Triggered by:** ${{ github.event_name }}

        ---

        ## Test Execution Summary

        EOF

        # Add unit test results
        if [ -f test-results/unit-tests.xml ]; then
          echo "### Unit Tests" >> test-results/reports/full-report.md
          total=$(grep -oP 'tests="\K[0-9]+' test-results/unit-tests.xml | head -1 || echo "0")
          failures=$(grep -oP 'failures="\K[0-9]+' test-results/unit-tests.xml | head -1 || echo "0")
          passed=$((total - failures))
          echo "- Total: $total" >> test-results/reports/full-report.md
          echo "- Passed: $passed ✅" >> test-results/reports/full-report.md
          echo "- Failed: $failures ❌" >> test-results/reports/full-report.md
          echo "" >> test-results/reports/full-report.md
        fi

        # Add integration test results
        if [ -f test-results/integration-tests.xml ]; then
          echo "### Integration Tests" >> test-results/reports/full-report.md
          total=$(grep -oP 'tests="\K[0-9]+' test-results/integration-tests.xml | head -1 || echo "0")
          failures=$(grep -oP 'failures="\K[0-9]+' test-results/integration-tests.xml | head -1 || echo "0")
          passed=$((total - failures))
          echo "- Total: $total" >> test-results/reports/full-report.md
          echo "- Passed: $passed ✅" >> test-results/reports/full-report.md
          echo "- Failed: $failures ❌" >> test-results/reports/full-report.md
          echo "" >> test-results/reports/full-report.md
        fi

        # Add coverage report if available
        if [ -f htmlcov/index.html ]; then
          echo "### Coverage Report" >> test-results/reports/full-report.md
          echo "Coverage report generated and available in artifacts." >> test-results/reports/full-report.md
          echo "" >> test-results/reports/full-report.md
        fi

        echo "---" >> test-results/reports/full-report.md
        echo "*Generated by GitHub Actions - Full Test Suite*" >> test-results/reports/full-report.md

    - name: Upload test results and coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-test-results-${{ github.run_number }}
        path: |
          test-results/
          htmlcov/
          test-output.log
        retention-days: 90

    - name: Upload coverage reports to Codecov
      if: always() && hashFiles('test-results/coverage.xml') != ''
      uses: codecov/codecov-action@v4
      with:
        files: test-results/coverage.xml
        flags: full-suite
        name: codecov-full-suite
        fail_ci_if_error: false
      continue-on-error: true

    - name: Publish test summary
      if: always()
      run: |
        if [ -f test-results/reports/full-report.md ]; then
          cat test-results/reports/full-report.md >> $GITHUB_STEP_SUMMARY
        fi

    - name: Check test status
      if: steps.test.outputs.exit_code != '0'
      run: |
        echo "::error::Tests failed with exit code ${{ steps.test.outputs.exit_code }}"
        exit 1
