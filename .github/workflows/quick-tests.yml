name: Quick Tests

on:
  push:
    branches: [ main, develop, binance ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/quick-tests.yml'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quick-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Create virtual environment
      run: |
        python -m venv venv
        source venv/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-timeout pytest-flask
        if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

    - name: Run quick tests
      id: test
      continue-on-error: true
      run: |
        chmod +x quick_test.sh
        ./quick_test.sh 2>&1 | tee test-output.log
        echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

    - name: Run tests with coverage and save results
      if: always()
      run: |
        mkdir -p test-results
        pytest tests/unit/test_web_dashboard.py \
          -v \
          --junitxml=test-results/junit.xml \
          --cov=web_dashboard \
          --cov-report=xml:test-results/coverage.xml \
          --cov-report=html:test-results/htmlcov \
          --cov-report=term-missing \
          --tb=short || true

    - name: Generate test summary
      if: always()
      run: |
        echo "# Test Results Summary" > test-results/summary.md
        echo "" >> test-results/summary.md
        echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> test-results/summary.md
        echo "**Branch:** ${{ github.ref_name }}" >> test-results/summary.md
        echo "**Commit:** ${{ github.sha }}" >> test-results/summary.md
        echo "**Workflow:** ${{ github.workflow }}" >> test-results/summary.md
        echo "" >> test-results/summary.md

        if [ -f test-results/junit.xml ]; then
          echo "## Test Statistics" >> test-results/summary.md
          echo "" >> test-results/summary.md

          # Parse JUnit XML for statistics
          total=$(grep -oP 'tests="\K[0-9]+' test-results/junit.xml | head -1 || echo "0")
          failures=$(grep -oP 'failures="\K[0-9]+' test-results/junit.xml | head -1 || echo "0")
          errors=$(grep -oP 'errors="\K[0-9]+' test-results/junit.xml | head -1 || echo "0")
          skipped=$(grep -oP 'skipped="\K[0-9]+' test-results/junit.xml | head -1 || echo "0")
          passed=$((total - failures - errors - skipped))

          echo "- **Total Tests:** $total" >> test-results/summary.md
          echo "- **Passed:** $passed ✅" >> test-results/summary.md
          echo "- **Failed:** $failures ❌" >> test-results/summary.md
          echo "- **Errors:** $errors ⚠️" >> test-results/summary.md
          echo "- **Skipped:** $skipped ⏭️" >> test-results/summary.md
          echo "" >> test-results/summary.md

          if [ "$failures" -eq 0 ] && [ "$errors" -eq 0 ]; then
            echo "**Status:** ✅ All tests passed!" >> test-results/summary.md
          else
            echo "**Status:** ❌ Some tests failed" >> test-results/summary.md
          fi
        else
          echo "⚠️ No test results available" >> test-results/summary.md
        fi

        echo "" >> test-results/summary.md
        echo "## Coverage Report" >> test-results/summary.md
        echo "" >> test-results/summary.md

        if [ -f test-results/coverage.xml ]; then
          coverage=$(grep -oP 'line-rate="\K[0-9.]+' test-results/coverage.xml | head -1 || echo "0")
          coverage_percent=$(echo "$coverage * 100" | bc -l | xargs printf "%.1f")
          echo "**Coverage:** ${coverage_percent}%" >> test-results/summary.md
        else
          echo "⚠️ Coverage report not available" >> test-results/summary.md
        fi

        echo "" >> test-results/summary.md
        echo "---" >> test-results/summary.md
        echo "*Generated by GitHub Actions*" >> test-results/summary.md

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_number }}
        path: |
          test-results/
          test-output.log
        retention-days: 30

    - name: Upload coverage to Codecov (optional)
      if: always() && hashFiles('test-results/coverage.xml') != ''
      uses: codecov/codecov-action@v4
      with:
        file: test-results/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

    - name: Comment PR with test results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-results/summary.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Publish test results summary
      if: always()
      run: |
        cat test-results/summary.md >> $GITHUB_STEP_SUMMARY

    - name: Check test status
      if: steps.test.outputs.exit_code != '0'
      run: |
        echo "Tests failed with exit code ${{ steps.test.outputs.exit_code }}"
        exit 1
