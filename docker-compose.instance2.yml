###############################################################################
# Instance 2 Docker Compose Configuration
# Uses DeepSeek provider for cost optimization
# Runs: RL Bot, Chart Bot, and Web Dashboard (no CrewAI)
# Port: 5001
###############################################################################

services:
  # RL Trading Bot Service - Instance 2
  rl-bot-2:
    build: .
    container_name: rl-trading-bot-2
    command: python3 rl_bot_ready.py
    volumes:
      - ./logs:/app/logs
      - ./data2:/app/data
      - ./trading_bot_2.db:/app/trading_bot.db
      - ./trading_data_2.db:/app/trading_data.db
      - ./shared2:/app/shared
      - ./trading_bot_2.log:/app/trading_bot.log
    environment:
      - PYTHONUNBUFFERED=1
      - INSTANCE_ID=2
      - FLASK_PORT=5001
    env_file:
      - .env.instance2
    secrets:
      - binance_api_key
      - binance_secret_key
      - deepseek_api_key
      # Telegram notifications disabled for instance 2 (to prevent flooding)
      # - telegram_bot_token
      # - telegram_chat_id
      - bot_control_pin
      - news_api_key
    restart: unless-stopped
    networks:
      - trading-network-2
    healthcheck:
      test: ["CMD", "pgrep", "-f", "rl_bot_ready.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Chart Analysis Bot Service - Instance 2
  chart-bot-2:
    build: .
    container_name: chart-analysis-bot-2
    command: python3 chart_analysis_bot.py
    volumes:
      - ./logs:/app/logs
      - ./data2:/app/data
      - ./trading_bot_2.db:/app/trading_bot.db
      - ./trading_data_2.db:/app/trading_data.db
      - ./shared2:/app/shared
      - ./chart_analysis_2.log:/app/chart_analysis.log
      - .:/app/charts
    environment:
      - PYTHONUNBUFFERED=1
      - INSTANCE_ID=2
    env_file:
      - .env.instance2
    secrets:
      - binance_api_key
      - binance_secret_key
      - deepseek_api_key
      # Telegram notifications disabled for instance 2 (to prevent flooding)
      # - telegram_bot_token
      # - telegram_chat_id
      - bot_control_pin
      - news_api_key
    restart: unless-stopped
    networks:
      - trading-network-2
    depends_on:
      - rl-bot-2
    healthcheck:
      test: ["CMD", "pgrep", "-f", "chart_analysis_bot.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CrewAI AI Agent Bot Service - Instance 2
  crewai-bot-2:
    build: .
    container_name: crewai-agent-bot-2
    command: python3 rl_bot_with_crewai.py
    volumes:
      - ./logs:/app/logs
      - ./data2:/app/data
      - ./trading_bot_2.db:/app/trading_bot.db
      - ./trading_data_2.db:/app/trading_data.db
      - ./shared2:/app/shared
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - INSTANCE_ID=2
    env_file:
      - .env.instance2
    secrets:
      - binance_api_key
      - binance_secret_key
      - deepseek_api_key
      # Telegram notifications disabled for instance 2 (to prevent flooding)
      # - telegram_bot_token
      # - telegram_chat_id
      - bot_control_pin
      - news_api_key
    restart: unless-stopped
    networks:
      - trading-network-2
    depends_on:
      - rl-bot-2
    healthcheck:
      test: ["CMD", "pgrep", "-f", "rl_bot_with_crewai.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Dashboard Service - Instance 2
  web-dashboard-2:
    build: .
    container_name: web-dashboard-2
    command: python3 web_dashboard.py
    volumes:
      - ./logs:/app/logs
      - ./data2:/app/data
      - ./trading_bot_2.db:/app/trading_bot.db
      - ./trading_data_2.db:/app/trading_data.db
      - ./shared2:/app/shared
      - ./templates:/app/templates
      - ./static:/app/static
      - /var/run/docker.sock:/var/run/docker.sock
      - ./trading_bot_2.log:/app/trading_bot.log
      - ./chart_analysis_2.log:/app/chart_analysis.log
      - ./news_sentiment_2.json:/app/news_sentiment.json
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_PORT=5001
      - INSTANCE_ID=2
    env_file:
      - .env.instance2
    secrets:
      - binance_api_key
      - binance_secret_key
      - deepseek_api_key
      - telegram_bot_token
      - telegram_chat_id
      - bot_control_pin
      - news_api_key
    ports:
      - "5001:5001"
    restart: unless-stopped
    networks:
      - trading-network-2
    depends_on:
      - rl-bot-2
      - chart-bot-2
      - crewai-bot-2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Define secrets from files
secrets:
  binance_api_key:
    file: ./secrets/binance_api_key
  binance_secret_key:
    file: ./secrets/binance_secret_key
  openai_api_key:
    file: ./secrets/openai_api_key
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  telegram_chat_id:
    file: ./secrets/telegram_chat_id
  bot_control_pin:
    file: ./secrets/bot_control_pin
  news_api_key:
    file: ./secrets/news_api_key

networks:
  trading-network-2:
    driver: bridge

volumes:
  logs:
  data2:
